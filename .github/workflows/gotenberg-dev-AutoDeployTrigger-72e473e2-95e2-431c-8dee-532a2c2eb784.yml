name: Trigger auto deployment for gotenberg-dev

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develop ]
    paths:
    - '**'
    - '.github/workflows/gotenberg-dev-AutoDeployTrigger-72e473e2-95e2-431c-8dee-532a2c2eb784.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.GOTENBERGDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GOTENBERGDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GOTENBERGDEV_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/build
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: xpanddockerregistry.azurecr.io
          registryUsername: ${{ secrets.GOTENBERGDEV_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GOTENBERGDEV_REGISTRY_PASSWORD }}
          containerAppName: gotenberg-dev
          resourceGroup: xpand-development-group
          imageToBuild: xpanddockerregistry.azurecr.io/gotenberg-dev:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


